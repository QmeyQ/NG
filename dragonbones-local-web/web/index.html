<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>龙骨本地播放器 · DragonBones 本地预览</title>
<style>
  :root {
    --bg: #0d0f14;
    --panel: #14171f;
    --panel-2: #191d27;
    --line: #262c3a;
    --text: #e6e9f0;
    --text-dim: #8b93a7;
    --accent: #2dd4bf;
    --accent-dim: #146b61;
    --danger: #f87171;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", "Microsoft YaHei UI", system-ui, -apple-system, sans-serif;
    font-size: 13px;
    overflow: hidden;
  }
  .app { display: flex; height: 100vh; }

  /* ---------- 左侧面板 ---------- */
  .panel {
    width: 308px;
    min-width: 308px;
    background: var(--panel);
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    overflow-y: auto;
  }
  .panel-head {
    padding: 18px 18px 14px;
    border-bottom: 1px solid var(--line);
  }
  .panel-head h1 {
    margin: 0;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: .5px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px var(--accent); }
  .panel-head p {
    margin: 8px 0 0;
    color: var(--text-dim);
    font-size: 11.5px;
    line-height: 1.6;
  }
  .sec { padding: 14px 18px; border-bottom: 1px solid var(--line); }
  .sec h2 {
    margin: 0 0 10px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: var(--text-dim);
  }
  .demos { display: flex; flex-direction: column; gap: 8px; }
  .demo-btn {
    text-align: left;
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 9px 11px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 12.5px;
    line-height: 1.5;
    transition: border-color .15s, background .15s;
  }
  .demo-btn:hover { border-color: var(--accent-dim); background: #1c222d; }
  .demo-btn.active { border-color: var(--accent); background: #10231f; }
  .demo-btn small { display: block; color: var(--text-dim); font-size: 11px; }

  .drop {
    border: 1px dashed #333c52;
    border-radius: 10px;
    padding: 14px;
    text-align: center;
    color: var(--text-dim);
    font-size: 12px;
    line-height: 1.7;
    transition: border-color .15s, background .15s, color .15s;
  }
  .drop.over { border-color: var(--accent); background: #10231f; color: var(--text); }
  .drop strong { display: block; color: var(--text); font-size: 13px; margin-bottom: 2px; }
  .drop .btns { display: flex; gap: 8px; justify-content: center; margin: 10px 0 8px; }
  .mini-btn {
    background: #232a38;
    border: 1px solid #333c52;
    color: var(--text);
    border-radius: 7px;
    padding: 6px 12px;
    font-size: 12px;
    cursor: pointer;
  }
  .mini-btn:hover { border-color: var(--accent-dim); color: var(--accent); }
  .drop small { display: block; font-size: 11px; line-height: 1.6; }

  .info-grid { display: grid; grid-template-columns: 68px 1fr; gap: 6px 10px; font-size: 12px; }
  .info-grid .k { color: var(--text-dim); }
  .info-grid .v { color: var(--text); word-break: break-all; }

  /* ---------- 舞台 ---------- */
  .stage-wrap { flex: 1; position: relative; overflow: hidden; background: radial-gradient(circle at 50% 40%, #12151d 0%, #0a0c11 100%); }
  .stage { position: absolute; inset: 0; }
  .stage canvas { display: block; }
  .hint {
    position: absolute; left: 50%; top: 46%; transform: translate(-50%, -50%);
    color: #6b7387; font-size: 13px; text-align: center; line-height: 1.9; pointer-events: none;
  }
  .err {
    position: absolute; left: 50%; top: 44%; transform: translate(-50%, -50%);
    max-width: 520px; background: #2a1418; border: 1px solid #7f1d25;
    color: #fca5a5; padding: 14px 16px; border-radius: 10px; font-size: 12.5px; line-height: 1.7;
    white-space: pre-wrap; display: none;
  }
  .toast {
    position: absolute; left: 50%; bottom: 96px; transform: translateX(-50%);
    background: #10231f; border: 1px solid var(--accent-dim); color: var(--accent);
    padding: 7px 14px; border-radius: 999px; font-size: 12px; opacity: 0; transition: opacity .25s;
    pointer-events: none;
  }

  .controls {
    position: absolute; left: 16px; right: 16px; bottom: 16px;
    background: rgba(16, 19, 26, .92);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 10px 12px;
    display: flex; align-items: center; flex-wrap: wrap; gap: 10px 16px;
    backdrop-filter: blur(6px);
  }
  .ctl { display: flex; align-items: center; gap: 7px; color: var(--text-dim); font-size: 12px; }
  select {
    background: #1d2330; color: var(--text); border: 1px solid #333c52;
    border-radius: 7px; padding: 5px 8px; font-size: 12px; min-width: 96px; max-width: 190px;
    outline: none;
  }
  select:focus { border-color: var(--accent-dim); }
  input[type="range"] { width: 92px; accent-color: var(--accent); }
  input[type="checkbox"] { accent-color: var(--accent); }
  .btn {
    background: #232a38; border: 1px solid #333c52; color: var(--text);
    border-radius: 8px; padding: 6px 13px; font-size: 12px; cursor: pointer;
  }
  .btn:hover { border-color: var(--accent-dim); color: var(--accent); }
  .btn.primary { background: #103029; border-color: var(--accent-dim); color: var(--accent); min-width: 68px; }
  .btn.primary:hover { background: #144037; }
  .val { color: var(--text); font-variant-numeric: tabular-nums; min-width: 42px; }
  .fps { margin-left: auto; color: #6b7387; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div class="app">
  <aside class="panel">
    <div class="panel-head">
      <h1><span class="dot"></span>龙骨本地播放器</h1>
      <p>DragonBones 5.7 运行时（本机由 DragonBonesJS 源码编译）<br>纯本地 · 离线 · 免费</p>
    </div>

    <div class="sec">
      <h2>内置示例</h2>
      <div class="demos" id="demoList"></div>
    </div>

    <div class="sec">
      <h2>载入自己的龙骨</h2>
      <div class="drop" id="drop">
        <strong>把龙骨文件拖到这里</strong>
        或
        <div class="btns">
          <button class="mini-btn" id="pickFiles">选择文件</button>
          <button class="mini-btn" id="pickFolder">选择文件夹</button>
        </div>
        <small>需要 *_ske.json（或 *_ske.dbbin）+ *_tex.json + *_tex.png</small>
      </div>
      <input type="file" id="fileInput" multiple hidden accept=".json,.dbbin,.png,.jpg,.jpeg" />
      <input type="file" id="folderInput" webkitdirectory hidden />
    </div>

    <div class="sec" style="border-bottom:none">
      <h2>当前资源</h2>
      <div class="info-grid">
        <div class="k">来源</div><div class="v" id="iSource">—</div>
        <div class="k">骨架</div><div class="v" id="iArmature">—</div>
        <div class="k">动画数</div><div class="v" id="iAnimCount">—</div>
        <div class="k">贴图</div><div class="v" id="iTexture">—</div>
        <div class="k">缩放</div><div class="v" id="iScale">—</div>
      </div>
    </div>
  </aside>

  <main class="stage-wrap">
    <div class="stage" id="stage"></div>
    <div class="hint" id="hint">从左侧选一个内置示例，<br>或把龙骨文件拖进来</div>
    <div class="err" id="err"></div>
    <div class="toast" id="toast"></div>

    <div class="controls">
      <div class="ctl">骨架<select id="armature"></select></div>
      <div class="ctl">动画<select id="anim"></select></div>
      <button class="btn primary" id="playBtn">暂停</button>
      <label class="ctl"><input type="checkbox" id="loop" checked /> 循环</label>
      <div class="ctl">速度<input type="range" id="speed" min="0.05" max="3" step="0.05" value="1" /><span class="val" id="speedVal">1.00×</span></div>
      <div class="ctl">缩放<input type="range" id="zoom" min="0.3" max="4" step="0.05" value="1" /><span class="val" id="zoomVal">1.00×</span></div>
      <button class="btn" id="fitBtn">适配窗口</button>
      <span class="fps" id="fps">-- FPS</span>
    </div>
  </main>
</div>

<script src="libs/pixi.js"></script>
<script src="libs/dragonBones.js"></script>
<script src="app.js"></script>
</body>
</html>
