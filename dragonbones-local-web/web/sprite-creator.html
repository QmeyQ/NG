<!DOCTYPE html><html><head><meta charset="utf-8"><title>Sprite Creator</title></head>
<body><canvas id="cv"></canvas><script>
// 生成 15 帧角色 sprite 表: idle0-4 / move4-8 / attack8-13 / hit14, 5列x3行 128px
const FW=128, FH=128, COLS=5, ROWS=3, N=15;
const cv=document.getElementById('cv'); cv.width=FW*COLS; cv.height=FH*ROWS;
const ctx=cv.getContext('2d');
function pose(i){
  // 返回姿态参数
  if(i<4){ const t=i/4*Math.PI*2; return {bob:Math.sin(t)*3, leg:0, arm:0.2, swing:0, lean:0, flash:0}; }        // idle
  if(i<8){ const t=(i-4)/4*Math.PI*2; return {bob:Math.abs(Math.sin(t))*-4, leg:Math.sin(t)*0.6, arm:0.4, swing:0, lean:0.1, flash:0}; } // move
  if(i<13){ const t=(i-8)/5; return {bob:0, leg:0.2, arm:0.6, swing:t, lean:0.2*t, flash:0}; }                    // attack
  return {bob:2, leg:0, arm:0.3, swing:0, lean:-0.3, flash:1};                                                   // hit
}
function drawChar(cx,cy,i){
  const p=pose(i);
  ctx.save(); ctx.translate(cx+FW/2, cy+FH/2+ p.bob); ctx.rotate(p.lean*0.3);
  const body = p.flash? '#ff8080' : '#4db2ff';
  // legs
  ctx.strokeStyle='#2a6f97'; ctx.lineWidth=8; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(-8,20); ctx.lineTo(-8+Math.sin(p.leg)*12, 44); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(8,20); ctx.lineTo(8-Math.sin(p.leg)*12, 44); ctx.stroke();
  // body
  ctx.fillStyle=body; ctx.beginPath(); ctx.ellipse(0,8,16,20,0,0,Math.PI*2); ctx.fill();
  // head
  ctx.fillStyle='#ffd9b3'; ctx.beginPath(); ctx.arc(0,-22,16,0,Math.PI*2); ctx.fill();
  // hair/ears (catgirl)
  ctx.fillStyle='#5a3ea1'; ctx.beginPath(); ctx.moveTo(-14,-30); ctx.lineTo(-8,-44); ctx.lineTo(-2,-32); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(14,-30); ctx.lineTo(8,-44); ctx.lineTo(2,-32); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.arc(0,-26,16,Math.PI,0); ctx.fill();
  // eyes
  ctx.fillStyle='#222'; ctx.beginPath(); ctx.arc(-6,-22,2.5,0,Math.PI*2); ctx.arc(6,-22,2.5,0,Math.PI*2); ctx.fill();
  // arm + sword (swing for attack)
  const ang = -0.5 + p.swing*2.2;
  ctx.save(); ctx.translate(12,2); ctx.rotate(ang);
  ctx.strokeStyle='#ffd9b3'; ctx.lineWidth=7; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(16,0); ctx.stroke();
  ctx.strokeStyle='#e0e0e0'; ctx.lineWidth=5; ctx.beginPath(); ctx.moveTo(16,0); ctx.lineTo(40,0); ctx.stroke();
  ctx.strokeStyle='#8d6e63'; ctx.lineWidth=6; ctx.beginPath(); ctx.moveTo(14,-4); ctx.lineTo(14,4); ctx.stroke();
  ctx.restore();
  // back arm
  ctx.strokeStyle='#ffd9b3'; ctx.lineWidth=7; ctx.beginPath(); ctx.moveTo(-12,2); ctx.lineTo(-20,12); ctx.stroke();
  ctx.restore();
}
for(let i=0;i<N;i++){ const cx=(i%COLS)*FW, cy=Math.floor(i/COLS)*FH; drawChar(cx,cy,i); }
window.__exportSprite=function(){
  const frames=[]; for(let i=0;i<N;i++){ frames.push({name:'f'+i, x:(i%COLS)*FW, y:Math.floor(i/COLS)*FH, w:FW, h:FH}); }
  return { png: cv.toDataURL('image/png'), frames, fw:FW, fh:FH, cols:COLS, rows:ROWS, n:N };
};
window.__ready=true;
</script></body></html>
