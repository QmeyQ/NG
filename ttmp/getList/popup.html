<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; }
    body {
      width: 640px;
      height: 600px;
      margin: 0;
      padding: 10px;
      font-family: monospace;
      font-size: 12px;
      display: flex;
      flex-direction: column;
    }
    .topbar {
      display: flex; gap: 6px; align-items: center;
      padding-bottom: 8px; border-bottom: 1px solid #eee;
      flex-shrink: 0;
    }
    .topbar strong { font-size: 13px; }
    #status { color: #007dff; font-size: 11px; white-space: nowrap; }
    .topbar input { flex: 1; padding: 3px 6px; font-family: monospace; font-size: 12px; min-width: 80px; }
    button { cursor: pointer; padding: 3px 10px; font-size: 12px; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    #groups {
      flex: 1; overflow-y: auto; padding: 8px 0; min-height: 0;
    }
    .empty-tip { color: #999; text-align: center; padding: 40px 0; }
    .group {
      border: 1px solid #e0e0e0; border-radius: 4px;
      margin-bottom: 8px; padding: 6px 8px; background: #fafafa;
    }
    .group-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 4px;
    }
    .group-title { font-weight: bold; color: #333; }
    .group-title .count { font-weight: normal; color: #888; font-size: 11px; margin-left: 6px; }
    .group textarea {
      width: 100%; font-family: monospace; font-size: 11px;
      resize: vertical; padding: 4px 6px;
      border: 1px solid #ddd; background: #fff;
      line-height: 1.4;
    }
    .bottombar {
      display: flex; gap: 6px; padding-top: 8px;
      border-top: 1px solid #eee; flex-shrink: 0;
    }
    #log {
      color: #888; font-size: 10px; max-height: 60px; overflow-y: auto;
      white-space: pre-wrap; padding-top: 6px;
      border-top: 1px solid #eee; flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div class="topbar">
    <strong>AGC 直链</strong>
    <span id="status">就绪</span>
    <input id="bucket" placeholder="bucket" value="sgf-rhq1y">
    <button id="start">自动遍历</button>
  </div>

  <div id="groups">
    <div class="empty-tip">点击"自动遍历"开始</div>
  </div>

  <div class="bottombar">
    <button id="copyAll">复制全部</button>
    <button id="refresh">刷新</button>
    <button id="clear">清空</button>
  </div>

  <div id="log"></div>
  <script src="popup.js"></script>
</body>
</html>
