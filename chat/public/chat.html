<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Codex 远程同步 · 聊天</title>
<style>
:root{--bg:#0b0f14;--panel:#111821;--panel2:#16202b;--line:#223041;--txt:#e6edf5;--dim:#8ba0b5;--acc:#37c98b;--acc2:#2f8fff;--warn:#ffb454;--danger:#ff6b6b;--bubble:#1b2836;--me:#1f4d3a}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(1200px 700px at 20% -10%,#17324a 0%,transparent 55%),radial-gradient(900px 600px at 110% 110%,#123a2c 0%,transparent 50%),var(--bg);color:var(--txt);font:14px/1.55 "Segoe UI","Microsoft YaHei",system-ui,sans-serif;overflow:hidden}
.app{height:100%;display:flex;flex-direction:column}
.top{height:56px;display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid var(--line);background:rgba(12,18,25,.86);backdrop-filter:blur(10px);flex:0 0 auto}
.logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:flex;align-items:center;justify-content:center;font-weight:800;color:#06120c;font-size:15px}
.brand{font-weight:700;letter-spacing:.3px}
.brand small{display:block;font-weight:400;color:var(--dim);font-size:11px;letter-spacing:0}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border:1px solid var(--line);border-radius:999px;color:var(--dim);font-size:12px;background:var(--panel)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--dim)}
.dot.ok{background:var(--acc);box-shadow:0 0 8px var(--acc)}
.dot.bad{background:var(--danger)}
.link{color:var(--acc2);text-decoration:none;font-size:12px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.link:hover{border-color:var(--acc2)}
.main{flex:1;display:flex;min-height:0}
.side{width:310px;min-width:250px;border-right:1px solid var(--line);display:flex;flex-direction:column;background:rgba(14,21,29,.75)}
.side-head{padding:12px;display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--line)}
.search{flex:1;display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:7px 9px}
.search input{all:unset;flex:1;color:var(--txt);font-size:13px;min-width:0}
.icon-btn{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--txt);cursor:pointer;font-size:20px;line-height:1;display:flex;align-items:center;justify-content:center}
.icon-btn:hover{border-color:var(--acc);color:var(--acc)}
.list{flex:1;overflow:auto;padding:6px}
.conv{display:flex;gap:10px;padding:10px;border-radius:11px;cursor:pointer;border:1px solid transparent;position:relative}
.conv:hover{background:var(--panel)}
.conv.active{background:var(--panel2);border-color:#2a4257}
.av{width:42px;height:42px;border-radius:12px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-weight:700;color:#07130d;background:linear-gradient(135deg,#4ad9a0,#2f8fff);font-size:15px}
.av.g{background:linear-gradient(135deg,#ffb454,#ff6b9a)}
.av.c{background:linear-gradient(135deg,#7bd0ff,#7a8cff)}
.av.i{background:linear-gradient(135deg,#c084fc,#7a8cff)}
.conv-body{flex:1;min-width:0}
.conv-top{display:flex;align-items:center;gap:6px}
.conv-title{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.conv-time{font-size:10.5px;color:var(--dim);flex:0 0 auto}
.conv-last{font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.badge{position:absolute;right:10px;bottom:10px;min-width:17px;height:17px;border-radius:9px;background:var(--danger);color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center;padding:0 5px}
.caret{color:var(--dim);font-size:10px;border:1px solid var(--line);border-radius:5px;padding:1px 4px}
.chat{flex:1;display:flex;flex-direction:column;min-width:0;background:linear-gradient(180deg,rgba(10,15,20,.2),rgba(10,15,20,.55))}
.chat-head{height:58px;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--line);background:rgba(14,21,29,.6);backdrop-filter:blur(8px)}
.chat-title{font-weight:700;font-size:15px}
.chat-sub{font-size:11px;color:var(--dim)}
.chat-tools{display:flex;gap:8px;align-items:center;margin-left:auto}
select,input,textarea{font-family:inherit}
.sel{background:var(--panel);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:6px 8px;font-size:12px;outline:none}
.msgs{flex:1;overflow:auto;padding:18px 18px 8px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth}
.msg{max-width:min(760px,82%);display:flex;flex-direction:column;gap:3px}
.msg.me{align-self:flex-end;align-items:flex-end}
.msg .b{white-space:pre-wrap;word-break:break-word;padding:10px 13px;border-radius:13px;background:var(--bubble);border:1px solid #243547;font-size:13.5px}
.msg.me .b{background:var(--me);border-color:#2c6b51}
.msg .meta{font-size:10px;color:var(--dim);padding:0 4px}
.msg .tag{color:var(--acc);font-size:10px;margin-left:6px}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--dim);gap:8px;text-align:center;padding:24px}
.empty .big{font-size:42px;opacity:.8}
.composer{border-top:1px solid var(--line);padding:12px;background:rgba(13,20,27,.9)}
.composer .row{display:flex;gap:10px;align-items:flex-end}
.composer textarea{flex:1;resize:none;min-height:44px;max-height:150px;background:var(--panel);border:1px solid var(--line);border-radius:11px;color:var(--txt);padding:11px 12px;font-size:13.5px;outline:none}
.composer textarea:focus{border-color:#2f8fff}
.send{height:44px;padding:0 18px;border-radius:11px;border:1px solid #2f8fff;background:linear-gradient(135deg,#2f8fff,#37c98b);color:#04110a;font-weight:700;cursor:pointer}
.send:disabled{filter:grayscale(.7);opacity:.6;cursor:not-allowed}
.hint{font-size:10.5px;color:var(--dim);margin-top:6px;display:flex;gap:10px;flex-wrap:wrap}
.dialog{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:18px}
.dialog.show{display:flex}
.card{width:min(440px,94vw);background:#0f1720;border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:0 24px 70px rgba(0,0,0,.5)}
.card h3{margin:0 0 12px;font-size:16px}
.field{margin-bottom:10px}
.field label{display:block;font-size:11.5px;color:var(--dim);margin-bottom:4px}
.field input,.field textarea{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 10px;color:var(--txt);outline:none}
.field input:focus{border-color:var(--acc2)}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--txt);border-radius:8px;padding:8px 12px;cursor:pointer;font-size:13px}
.btn.primary{border-color:var(--acc);background:linear-gradient(135deg,#2f8fff,#37c98b);color:#04110a;font-weight:700}
.btn.ghost{background:transparent}\n.btn.danger{border-color:#8a2b2b;color:#ff8a8a}
.mgrid{display:grid;grid-template-columns:90px 1fr;gap:6px;font-size:12px}.mgrid b{color:var(--dim);font-weight:600}.mactions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.mactions .btn{flex:1;min-width:90px}

.queuebar{display:none;margin:0 0 8px;padding:6px 10px;border:1px solid var(--line);border-radius:10px;background:rgba(18,27,36,.92);font-size:12px}
.queuebar.show{display:block}
.qhead{display:flex;align-items:center;gap:8px}
.qhead b{color:var(--warn)}
.qtoggle{margin-left:auto;border:1px solid var(--line);background:transparent;color:var(--dim);border-radius:6px;padding:2px 8px;cursor:pointer;font-size:11px}
.qlist{display:none;max-height:130px;overflow:auto;margin-top:6px}
.queuebar.open .qlist{display:block}
.qitem{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:8px;background:#0d151d;margin-bottom:4px}
.qtext{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--txt)}
.qdel{border:1px solid #6b2b2b;background:#221416;color:#ff8a8a;border-radius:6px;width:22px;height:22px;cursor:pointer;font-size:12px;line-height:1}
.qempty{color:var(--dim);padding:4px 0}
.statuspill{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);font-size:11px;color:var(--dim)}
.statuspill.active{color:var(--warn);border-color:#6b5227}
.statuspill.idle{color:var(--acc);border-color:#275c46}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#0f1720;border:1px solid var(--line);color:var(--txt);padding:9px 14px;border-radius:9px;opacity:0;pointer-events:none;transition:.25s;z-index:80;font-size:12.5px}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:760px){.side{width:120px;min-width:120px}.side .search{display:none}.conv-last,.conv-time{display:none}.brand small{display:none}.chat-tools .sel{display:none}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="logo">C</div>
    <div class="brand">Codex 远程同步<small>微信通道 · Web 对话 · 本地会话</small></div>
    <div class="spacer"></div>
    <span class="pill"><span id="dot" class="dot"></span><span id="statusText">连接中…</span></span>
    <a class="link" href="/codex">配置</a>
  </div>
  <div class="main">
    <aside class="side">
      <div class="side-head">
        <div class="search">🔎<input id="q" placeholder="搜索会话"></div>
        <button class="icon-btn" id="newChat" title="新建聊天">+</button>
      </div>
      <div class="list" id="list"></div>
    </aside>
    <section class="chat">
      <div class="chat-head">
        <div>
          <div class="chat-title" id="chatTitle">选择一个会话</div>
          <div class="chat-sub" id="chatSub">左侧对话列表 · 与微信消息同步</div>
        </div>
        <div class="chat-tools">
          <select class="sel" id="model" title="模型"></select>
          <span class="pill" id="modePill">local</span>
        </div>
      </div>
      <div class="msgs" id="msgs">
        <div class="empty"><div class="big">💬</div><div>从左侧选择会话，或点击 + 新建聊天</div><div style="font-size:11px">微信好友/群消息会自动出现在这里</div></div>
      </div>
      <div class="composer">
        <div class="queuebar" id="queueBar">
          <div class="qhead"><b id="qCount">队列 0</b><span id="qPreview" class="qtext"></span><button class="qtoggle" id="qToggle">展开</button></div>
          <div class="qlist" id="qList"></div>
        </div>
        <div class="row">
          <textarea id="input" rows="1" placeholder="给 Codex 发消息…  Enter 发送 / Shift+Enter 换行"></textarea>
          <button class="send" id="send" disabled>发送</button>
        </div>
        <div class="hint"><span>工作目录: <b id="cwdHint">-</b></span><span>会话: <b id="peerHint">-</b></span><span id="typing"></span></div>
      </div>
    </section>
  </div>
</div>

<div class="dialog" id="tokenDlg">
  <div class="card">
    <h3>输入访问令牌</h3>
    <div class="field"><label>Token（见 chat/config.json 或配置页）</label><input id="tokenInput" placeholder="cx-..."></div>
    <div class="actions"><button class="btn ghost" id="tokenLater">稍后</button><button class="btn primary" id="tokenSave">连接</button></div>
  </div>
</div>

<div class="dialog" id="newDlg">
  <div class="card">
    <h3>新建聊天</h3>
    <div class="field"><label>会话 ID / 对方标识</label><input id="newPeer" placeholder="例如 wxid_xxx 或 project-a"></div>
    <div class="field"><label>首条消息（可选）</label><textarea id="newText" rows="3" placeholder="给 Codex 的任务…"></textarea></div>
    <div class="actions"><button class="btn ghost" id="newCancel">取消</button><button class="btn primary" id="newOk">创建</button></div>
  </div>
</div>

<div class="dialog" id="manageDlg">
  <div class="card">
    <h3>会话管理</h3>
    <div class="mgrid">
      <b>会话</b><span id="mTitle"></span>
      <b>ID</b><span id="mId" style="word-break:break-all"></span>
      <b>类型</b><span id="mKind"></span>
      <b>目录</b><span id="mCwd" style="word-break:break-all"></span>
      <b>模型</b><span id="mModel"></span>
    </div>
    <div class="field"><label>新标题</label><input id="mName" placeholder="留空不改名"></div>
    <div class="mactions">
      <button class="btn primary" id="mContinue">继续会话</button>
      <button class="btn" id="mCopy">复制 ID</button>
      <button class="btn" id="mRename">改名</button>
      <button class="btn" id="mArchive">归档</button>
      <button class="btn" id="mUnarchive">取消归档</button>
      <button class="btn ghost" id="mClose">关闭</button>
      <button class="btn danger" id="mDelete">删除会话</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script>
(function(){
const $=id=>document.getElementById(id);
const API_BASE=(localStorage.getItem('cx_api')||new URLSearchParams(location.search).get('api')||(/normalgame\.cn$/i.test(location.hostname)?'/codex-api':'')).replace(/\/+$/,'');

const CACHE={convs:'cx_cache_convs',msgs:'cx_cache_msgs_'};
function cacheRead(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}}
function cacheWrite(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function cacheMsgs(peer){return cacheRead(CACHE.msgs+peer,[])}
function cacheMsgsWrite(peer,msgs){cacheWrite(CACHE.msgs+peer,msgs.slice(-200))}
const state={queues:{},queueOpen:false,token:localStorage.getItem('cx_token')||new URLSearchParams(location.search).get('token')||'',convs:[],active:null,models:[],sending:false,hist:{},unread:{}};
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>e.classList.remove('show'),2200)}
async function api(path,opts){
  opts=opts||{};const tk=(state.token||'').trim();opts.headers=Object.assign({},opts.headers||{});if(tk&&/^[\x20-\x7E]+$/.test(tk))opts.headers['X-Cx-Token']=tk;
  if(opts.body&&typeof opts.body!=='string'){opts.headers['Content-Type']='application/json';opts.body=JSON.stringify(opts.body)}
  const r=await fetch(API_BASE+path,opts);
  let j;try{j=await r.json()}catch(e){throw new Error('HTTP '+r.status)}
  if(r.status===401){showToken();throw new Error('需要 Token')}
  if(!r.ok||j.ok===false)throw new Error(j.error||('HTTP '+r.status));
  return j;
}
function showToken(){$('tokenDlg').classList.add('show');$('tokenInput').value=state.token||''}
function fmtTime(ts){if(!ts)return'';const d=new Date(ts),n=new Date();const p=x=>String(x).padStart(2,'0');if(d.toDateString()===n.toDateString())return p(d.getHours())+':'+p(d.getMinutes());return (d.getMonth()+1)+'/'+d.getDate()}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function avatar(c){return c.kind==='group'?'群':(c.kind==='wechat'?'微':(c.kind==='ide'?'I':'C'))}
function renderConvs(){
  const q=($('q').value||'').toLowerCase();
  const list=state.convs.filter(c=>!q||(c.title||'').toLowerCase().includes(q)||(c.id||'').toLowerCase().includes(q));
  $('list').innerHTML=list.length?list.map(c=>`<div class="conv ${c.id===state.active?'active':''}" data-id="${esc(c.id)}"><div class="av ${c.kind==='group'?'g':(c.kind==='wechat'?'':(c.kind==='ide'?'i':'c'))}">${avatar(c)}</div><div class="conv-body"><div class="conv-top"><div class="conv-title">${esc(c.title||c.id)}</div><div class="conv-time">${fmtTime(c.updatedAt)}</div></div><div class="conv-last">${esc(c.last||'（暂无消息）')}</div></div>${state.unread[c.id]?`<span class="badge">${state.unread[c.id]}</span>`:''}</div>`).join(''):`<div class="empty" style="padding:30px 10px"><div>暂无会话</div><div style="font-size:11px">点击 + 新建</div></div>`;
  document.querySelectorAll('.conv').forEach(el=>{el.onclick=()=>openConv(el.dataset.id);el.ondblclick=e=>{e.preventDefault();openManage(el.dataset.id)}});
}
function queueItems(peer){return state.queues[peer]||[]}
function queueText(item){const inp=item&&item.input&&item.input[0];return (inp&&inp.text)||(item&&item.text)||''}
function renderQueue(){
  const peer=state.active;const bar=$('queueBar');if(!peer||!peer.startsWith('ide:')){bar.classList.remove('show');return}
  const items=queueItems(peer);bar.classList.add('show');$('qCount').textContent='队列 '+items.length;
  $('qPreview').textContent=items.length?queueText(items[0]).slice(0,60):'';
  $('qToggle').textContent=state.queueOpen?'收起':'展开';
  $('qList').innerHTML=items.length?items.map(function(it){return '<div class="qitem" data-id="'+esc(it.id)+'"><span class="qtext">'+esc(queueText(it))+'</span><button class="qdel" title="删除">×</button></div>'}).join(''):'<div class="qempty">暂无等待任务</div>';
  document.querySelectorAll('.qitem .qdel').forEach(function(b){b.onclick=async function(){const id=b.parentElement.dataset.id;await delQueueItem(peer,id)}})
}
async function loadQueue(peer){
  if(!peer||!peer.startsWith('ide:'))return;
  try{
    const r=await api('/api/ide/queue?peer='+encodeURIComponent(peer));
    const q=(r.queue&&r.queue.data)||[];
    state.queues[peer]=q.map(function(x){return x.queuedSubmission||x});
    renderQueue();
  }catch(e){}
}
async function delQueueItem(peer,id){
  try{
    await api('/api/ide/queue/delete',{method:'POST',body:{peer,queuedSubmissionId:id}});
    state.queues[peer]=queueItems(peer).filter(function(x){return x.id!==id});
    renderQueue();toast('已删除等待任务')
  }catch(e){toast(e.message)}
}
function addQueueItem(peer,item){if(!peer||!item)return;state.queues[peer]=queueItems(peer).concat([item]);renderQueue()}
async function loadConvs(){
  state.convs=cacheRead(CACHE.convs,[]);renderConvs();
  try{const r=await api('/api/conversations');state.convs=r.conversations||[];cacheWrite(CACHE.convs,state.convs);renderConvs()}catch(e){}
}
async function loadModels(){
  try{const r=await api('/api/models');state.models=r.models||[];$('model').innerHTML=state.models.map(m=>`<option value="${esc(m.slug)}">${esc(m.label||m.slug)}</option>`).join('')}catch(e){}
}
async function openConv(id){
  state.active=id;delete state.unread[id];renderConvs();
  const c=state.convs.find(x=>x.id===id)||{id};
  $('chatTitle').textContent=c.title||id;$('chatSub').textContent=(c.kind==='wechat'?'微信会话':c.kind==='group'?'微信群':(c.kind==='ide'?'Codex IDE 会话':'Codex 会话'))+' · '+id;
  $('peerHint').textContent=id;$('send').disabled=false;
  const st=(c.status&&c.status.type)||'';
  $('chatSub').textContent=(c.kind==='wechat'?'微信会话':c.kind==='group'?'微信群':(c.kind==='ide'?'Codex IDE 会话':'Codex 会话'))+' · '+id+(st?' · '+(st==='active'?'工作中':st==='idle'?'空闲':st):'');
  if(String(id).startsWith('ide:'))loadQueue(id);
  const cached=cacheMsgs(id);renderMsgs(cached);
  const since=cached.length?cached[cached.length-1].ts||0:0;
  try{const r=await api('/api/history?peer='+encodeURIComponent(id)+(since?'&since='+since:''));const newMsgs=(r.history&&r.history.messages)||[];if(newMsgs.length){const merged=cached.concat(newMsgs).slice(-200);cacheMsgsWrite(id,merged);renderMsgs(merged)}}catch(e){if(!cached.length)$('msgs').innerHTML='<div class="empty"><div>'+esc(e.message)+'</div></div>'}
}
function renderMsgs(msgs){
  if(!msgs.length){$('msgs').innerHTML='<div class="empty"><div class="big">✨</div><div>开始对话吧</div></div>';return}
  $('msgs').innerHTML=msgs.map(m=>{const me=m.role==='user';return `<div class="msg ${me?'me':''}"><div class="b">${esc(m.text)}</div><div class="meta">${me?'我':'Codex'}${m.via==='wechat'?'<span class="tag">微信</span>':''} · ${fmtTime(m.ts)}</div></div>`}).join('');
  $('msgs').scrollTop=$('msgs').scrollHeight;
}
function appendMsg(m){const e=$('msgs');if(!e.querySelector('.msg'))e.innerHTML='';const me=m.role==='user';const d=document.createElement('div');d.className='msg '+(me?'me':'');d.innerHTML=`<div class="b">${esc(m.text)}</div><div class="meta">${me?'我':'Codex'}${m.via==='wechat'?'<span class="tag">微信</span>':''} · ${fmtTime(Date.now())}</div>`;e.appendChild(d);e.scrollTop=e.scrollHeight}

let manageId=null;
function openManage(id){
  const c=state.convs.find(x=>x.id===id); if(!c) return;
  manageId=id;
  $('mTitle').textContent=c.title||id;
  $('mId').textContent=id;
  $('mKind').textContent=c.kind||'codex';
  $('mCwd').textContent=c.cwd||'-';
  $('mModel').textContent=c.model||'-';
  $('mName').value='';
  $('manageDlg').classList.add('show');
}
async function manageOp(op,name){
  if(!manageId) return;
  try{
    if(!manageId.startsWith('ide:')){toast('仅 IDE 会话支持管理');return}
    const r=await api('/api/ide/manage',{method:'POST',body:{threadId:manageId.slice(4),op,name}});
    toast('操作成功');await loadConvs();
  }catch(e){toast(e.message)}
}
async function deleteConv(){
  if(!manageId) return;
  if(!confirm('删除该会话？将同时删除 Codex 端线程，不可恢复。')) return;
  try{
    await api('/api/conv/delete',{method:'POST',body:{peer:manageId}});
    localStorage.removeItem(CACHE.msgs+manageId);
    state.convs=state.convs.filter(x=>x.id!==manageId);
    if(state.active===manageId){state.active=null;$('msgs').innerHTML='<div class="empty"><div class="big">✨</div><div>会话已删除</div></div>';$('send').disabled=true}
    renderConvs();$('manageDlg').classList.remove('show');toast('已删除');
  }catch(e){toast(e.message)}
}
async function send(){
  const text=$('input').value.trim();if(!text||state.sending)return;
  if(!state.active){toast('请先选择或新建会话');return}
  state.sending=true;$('send').disabled=true;$('typing').textContent='Codex 思考中…';
  $('input').value='';$('input').style.height='auto';
  appendMsg({role:'user',text});
  try{
    const r=await api('/api/chat',{method:'POST',body:{peer:state.active,text,model:$('model').value||undefined}});
    if(r.mode==='queued'){const q=r.result&&r.result.queued&&r.result.queued.queuedSubmission;addQueueItem(state.active,q);toast('已加入等待队列')}else{appendMsg({role:'assistant',text:r.text||'(空回复)'})}
    await loadConvs();
  }catch(e){appendMsg({role:'assistant',text:'[错误] '+e.message});toast(e.message)}
  finally{state.sending=false;$('send').disabled=false;$('typing').textContent=''}
}
async function boot(){
  if(!state.token){showToken()}
  try{const r=await api('/api/status');$('dot').className='dot ok';$('statusText').textContent=(r.codex&&r.codex.version?r.codex.version:'在线')+' · '+r.mode;$('modePill').textContent=r.mode;$('cwdHint').textContent=(r.codex&&r.codex.cwd)||'-';}catch(e){$('dot').className='dot bad';$('statusText').textContent='未连接'}
  await loadModels();await loadConvs();
  if(state.convs.length)openConv(state.convs[0].id);
  if(new URLSearchParams(location.search).get('noevents')==='1')return;
  setInterval(function(){if(state.active&&String(state.active).startsWith('ide:'))loadQueue(state.active)},5000);
  const es=new EventSource(API_BASE+'/api/events');
  es.addEventListener('message',ev=>{try{const m=JSON.parse(ev.data);if(m.peer===state.active&&state.sending===false)appendMsg(m);else if(m.peer!==state.active){state.unread[m.peer]=(state.unread[m.peer]||0)+1;renderConvs();loadConvs()}}catch(e){}});
  es.addEventListener('conversations',()=>loadConvs());
  es.addEventListener('history',ev=>{try{const h=JSON.parse(ev.data);if(!h.peer||!Array.isArray(h.messages))return;cacheMsgsWrite(h.peer,h.messages);const c=state.convs.find(x=>x.id===h.peer);if(c){const last=h.messages[h.messages.length-1];if(last)c.last=String(last.text||'').slice(0,80);if(h.peer!==state.active){state.unread[h.peer]=(state.unread[h.peer]||0)+1;renderConvs()}}if(h.peer===state.active)renderMsgs(h.messages)}catch(e){}});
}
$('tokenSave').onclick=()=>{state.token=$('tokenInput').value.trim();localStorage.setItem('cx_token',state.token);$('tokenDlg').classList.remove('show');boot()};
$('tokenLater').onclick=()=>$('tokenDlg').classList.remove('show');
$('qToggle').onclick=function(){state.queueOpen=!state.queueOpen;$('queueBar').classList.toggle('open',state.queueOpen);renderQueue()};
$('newChat').onclick=()=>{$('newDlg').classList.add('show');$('newPeer').value='';$('newText').value='';$('newPeer').focus()};
$('newCancel').onclick=()=>$('newDlg').classList.remove('show');
$('mClose').onclick=()=>$('manageDlg').classList.remove('show');
$('mContinue').onclick=()=>{$('manageDlg').classList.remove('show');openConv(manageId)};
$('mCopy').onclick=()=>{navigator.clipboard.writeText(manageId).then(()=>toast('已复制')).catch(()=>toast('复制失败'))};
$('mRename').onclick=()=>{const n=$('mName').value.trim();if(!n){toast('请输入新标题');return}manageOp('rename',n)};
$('mDelete').onclick=deleteConv;
$('mArchive').onclick=()=>manageOp('archive');
$('mUnarchive').onclick=()=>manageOp('unarchive');
$('newOk').onclick=async()=>{const p=$('newPeer').value.trim()||('chat-'+Date.now());const t=$('newText').value.trim();$('newDlg').classList.remove('show');await openConv(p);if(t){$('input').value=t;send()}};
$('send').onclick=send;
$('q').oninput=renderConvs;
$('input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
$('input').addEventListener('input',function(){this.style.height='auto';this.style.height=Math.min(150,this.scrollHeight)+'px'});
boot();
})();
</script>
</body>
</html>
